services:
  suitecore-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suitecore-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - suitecore-net

networks:
  suitecore-net:
    driver: bridge
